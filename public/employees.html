<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Employees | Salary Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <main class="main-content">
      <div class="content-width">
        <header class="page-header">
          <div>
            <h1>Employees</h1>
            <p>View, filter, and manage employee records and outstanding balances.</p>
          </div>
          <a class="btn btn-primary" id="add-employee" href="/employee-detail">
            ＋ Add Employee
          </a>
        </header>

        <section class="filter-bar">
          <div class="form-group" style="flex: 1.5; min-width: 200px;">
            <label class="form-label" for="employee-search">Search</label>
            <input
              class="input"
              id="employee-search"
              placeholder="Search by name, code, or phone…"
            />
          </div>

          <div class="form-group manager-only" id="manager-filter-wrap">
            <label class="form-label" for="manager-filter">Manager</label>
            <select class="select" id="manager-filter">
              <option value="">All managers</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="status-filter">Status</label>
            <select class="select" id="status-filter">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="">All Statuses</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="sort-filter">Sort By</label>
            <select class="select" id="sort-filter">
              <option value="name_asc">Name A–Z</option>
              <option value="name_desc">Name Z–A</option>
              <option value="loan_high">Loan High–Low</option>
              <option value="loan_low">Loan Low–High</option>
            </select>
          </div>
        </section>

        <section class="card table-card">
          <!-- Desktop Table View -->
          <div class="table-wrap desktop-only-view">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Phone</th>
                  <th>Manager</th>
                  <th class="amount-col">Outstanding Loan</th>
                  <th>Status</th>
                  <th style="width: 80px; text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody id="employees-body">
                <tr class="skeleton-row">
                  <td colspan="6"><span class="skeleton"></span></td>
                </tr>
                <tr class="skeleton-row">
                  <td colspan="6"><span class="skeleton"></span></td>
                </tr>
                <tr class="skeleton-row">
                  <td colspan="6"><span class="skeleton"></span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Mobile Cards View -->
          <div class="mobile-only-cards" id="employees-cards">
            <!-- Rendered dynamically on mobile -->
          </div>

          <div id="pagination"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/employees.js"></script>
  </body>
</html>
