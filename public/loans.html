<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Loans Overview | Salary Tracker</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <main class="main-content">
      <div class="content-width">
        <header class="page-header">
          <div>
            <h1>Loans Overview</h1>
            <p>
              Track balances, repayment progress, and active employee loans.
            </p>
          </div>
          <a class="btn btn-primary" href="/add-entry">Add Loan Entry</a>
        </header>
        <section class="grid grid-4" id="loan-kpis">
          <div class="card kpi-card danger">
            <span class="kpi-label">Active Loans</span
            ><span class="skeleton kpi-value"></span>
          </div>
          <div class="card kpi-card danger">
            <span class="kpi-label">Outstanding Balance</span
            ><span class="skeleton kpi-value"></span>
          </div>
          <div class="card kpi-card success">
            <span class="kpi-label">Fully Repaid</span
            ><span class="skeleton kpi-value"></span>
          </div>
          <div class="card kpi-card success">
            <span class="kpi-label">Total Repaid</span
            ><span class="skeleton kpi-value"></span>
          </div>
        </section>
        <section class="filter-bar" style="margin-top: 20px">
          <div class="form-group">
            <label class="form-label">Employee</label
            ><select class="select" id="employee-filter">
              <option value="">All employees with loans</option>
            </select>
          </div>
          <div class="form-group manager-only">
            <label class="form-label">Manager</label
            ><select class="select" id="manager-filter">
              <option value="">All managers</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label
            ><select class="select" id="status-filter">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="paid">Paid</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Loan type</label
            ><select class="select" id="type-filter">
              <option value="">All loan types</option>
              <option value="pre_system">Before System</option>
              <option value="regular">Regular</option>
            </select>
          </div>
          <button class="btn btn-secondary" id="clear-loan-filters">
            Clear filters
          </button>
        </section>
        <section class="card table-card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Manager</th>
                  <th>Loan Type</th>
                  <th>Loan Date</th>
                  <th>Amount</th>
                  <th>Repaid</th>
                  <th>Remaining</th>
                  <th>Progress</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="loans-body">
                <tr class="skeleton-row">
                  <td colspan="9"><span class="skeleton"></span></td>
                </tr>
                <tr class="skeleton-row">
                  <td colspan="9"><span class="skeleton"></span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/loans.js"></script>
