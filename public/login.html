<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sign In | Salary & Loan Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <style>
      .login-body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 20%, #115e59 0%, #0f172a 75%, #020617 100%);
        padding: 20px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .login-card {
        width: min(440px, 100%);
        padding: 36px 32px;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 50px -10px rgba(13, 148, 136, 0.25);
        color: #f8fafc;
      }
      .login-logo-wrap {
        position: relative;
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-logo-glow {
        position: absolute;
        inset: -4px;
        border-radius: 24px;
        background: linear-gradient(135deg, #0d9488, #3b82f6, #8b5cf6, #10b981);
        opacity: 0.75;
        filter: blur(12px);
        animation: pulse-glow 3.5s ease-in-out infinite alternate;
        z-index: 0;
      }
      .login-logo-ring {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        padding: 3px;
        background: linear-gradient(135deg, #14b8a6, #3b82f6, #a855f7, #06b6d4);
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.4);
        animation: float 4s ease-in-out infinite;
        z-index: 1;
      }
      .login-logo-img {
        width: 100%;
        height: 100%;
        border-radius: 17px;
        object-fit: cover;
        background: #0f172a;
        display: block;
      }
      @keyframes pulse-glow {
        0% {
          transform: scale(0.92);
          opacity: 0.55;
          filter: blur(10px);
        }
        100% {
          transform: scale(1.08);
          opacity: 0.9;
          filter: blur(15px);
        }
      }
      .login-title {
        font-size: 26px;
        font-weight: 800;
        text-align: center;
        margin: 0 0 6px;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      .login-subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 13.5px;
        margin: 0 0 28px;
      }
      .login-input {
        background: rgba(30, 41, 59, 0.7) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        color: #f8fafc !important;
        border-radius: 10px;
      }
      .login-input:focus {
        border-color: #14b8a6 !important;
        box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.25) !important;
      }
      .login-label {
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
      }
      .btn-submit {
        background: linear-gradient(135deg, #0d9488, #0f766e);
        border: none;
        box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35);
        font-size: 15px;
        font-weight: 700;
        padding: 12px;
        border-radius: 10px;
        color: #ffffff;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-submit:hover {
        background: linear-gradient(135deg, #0f766e, #115e59);
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(13, 148, 136, 0.45);
      }
      .btn-submit:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body class="login-body">
    <button class="theme-toggle" id="theme-toggle" style="position: fixed; right: 20px; top: 20px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.15); color: #fff;">◐</button>
    <main class="login-card">
      <div class="login-logo-wrap">
        <div class="login-logo-glow"></div>
        <div class="login-logo-ring">
          <img src="/apple-touch-icon.png" alt="Company Logo" class="login-logo-img" onerror="this.src='/favicon.svg'" />
        </div>
      </div>
      <h1 class="login-title">Salary & Loan Tracker</h1>
      <p class="login-subtitle">Secure Manager & Admin Portal</p>

      <form id="login-form">
        <div class="form-group">
          <label class="login-label" for="username">Username</label>
          <input class="input login-input" id="username" autocomplete="username" placeholder="Enter your username" required />
        </div>
        <div class="form-group" style="margin-top: 18px">
          <label class="login-label" for="password">Password</label>
          <div style="position: relative">
            <input class="input login-input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required style="padding-right: 48px" />
            <button class="icon-button" id="password-toggle" type="button" aria-label="Show password" style="position: absolute; top: 50%; right: 6px; transform: translateY(-50%); color: #94a3b8">👁</button>
          </div>
        </div>
        <button class="btn btn-block btn-submit" style="margin-top: 24px; width: 100%;" type="submit">Sign In to Dashboard</button>
        <p id="login-error" class="hidden text-danger" style="margin: 16px 0 0; text-align: center; font-size: 13.5px;"></p>
      </form>
    </main>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
