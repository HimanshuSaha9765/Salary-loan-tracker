<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Audit Logs | Salary Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <main class="main-content">
      <div class="content-width">
        <header class="page-header">
          <div>
            <h1>Audit Logs</h1>
            <p>Track, filter, and audit administrative and financial activities.</p>
          </div>
        </header>

        <section class="filter-bar">
          <div class="form-group">
            <label class="form-label" for="employee-filter">Employee</label>
            <select class="select" id="employee-filter">
              <option value="">All employees</option>
            </select>
          </div>

          <div class="form-group manager-only" id="manager-filter-wrap">
            <label class="form-label" for="manager-filter">Manager</label>
            <select class="select" id="manager-filter">
              <option value="">All managers</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="action-filter">Action Type</label>
            <select class="select" id="action-filter">
              <option value="">All actions</option>
              <option value="LOAN_GIVEN">Loan Given</option>
              <option value="REPAYMENT">Loan Repayment</option>
              <option value="SALARY_GIVEN">Salary Given</option>
              <option value="ENTRY_DELETED">Entry Deleted</option>
              <option value="EMPLOYEE_CREATED">Employee Created</option>
              <option value="EMPLOYEE_UPDATED">Employee Updated</option>
              <option value="EMPLOYEE_PERMANENTLY_DELETED">Employee Deleted</option>
              <option value="MANAGER_CREATED">Manager Created</option>
              <option value="MANAGER_UPDATED">Manager Updated</option>
              <option value="MANAGER_PERMANENTLY_DELETED">Manager Deleted</option>
              <option value="ASSIGNMENT_UPDATED">Assignment Updated</option>
              <option value="LOGIN">User Login</option>
              <option value="LOGOUT">User Logout</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="date-filter">Date Range</label>
            <select class="select" id="date-filter">
              <option value="">All time</option>
              <option value="15">Last 15 days</option>
              <option value="30">Last 30 days</option>
              <option value="45">Last 45 days</option>
              <option value="60">Last 60 days</option>
              <option value="custom">Custom range</option>
            </select>
          </div>

          <div class="form-group hidden" id="from-date-wrap">
            <label class="form-label" for="from-date">From Date</label>
            <input
              class="input"
              id="from-date"
              inputmode="numeric"
              placeholder="DD/MM/YYYY"
              maxlength="10"
            />
          </div>

          <div class="form-group hidden" id="to-date-wrap">
            <label class="form-label" for="to-date">To Date</label>
            <input
              class="input"
              id="to-date"
              inputmode="numeric"
              placeholder="DD/MM/YYYY"
              maxlength="10"
            />
          </div>

          <button class="btn btn-secondary" id="clear-filters" type="button">
            Clear All Filters
          </button>
        </section>

        <section class="card table-card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="admin-only checkbox-col" style="width: 42px;">
                    <input type="checkbox" id="select-all" aria-label="Select all audit logs" />
                  </th>
                  <th>Timestamp IST</th>
                  <th>Performed By</th>
                  <th>Action</th>
                  <th>Employee</th>
                  <th>Amount</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody id="audit-body">
                <tr class="skeleton-row">
                  <td colspan="7"><span class="skeleton"></span></td>
                </tr>
                <tr class="skeleton-row">
                  <td colspan="7"><span class="skeleton"></span></td>
                </tr>
                <tr class="skeleton-row">
                  <td colspan="7"><span class="skeleton"></span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div id="pagination"></div>
        </section>

        <!-- Floating Selection Action Bar for Admin -->
        <div class="floating-action-bar hidden" id="selection-bar">
          <div class="selection-info">
            <span class="selection-badge" id="selected-count">0</span>
            <span class="selection-text">logs selected</span>
          </div>
          <div class="selection-actions">
            <button class="btn btn-secondary btn-sm" id="btn-deselect-all" type="button">Deselect All</button>
            <button class="btn btn-danger btn-sm" id="btn-bulk-delete" type="button">Delete Selected</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/audit-logs.js"></script>
  </body>
</html>
