<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Add Entry | Salary Tracker</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <main class="main-content">
      <div class="content-width">
        <header class="page-header">
          <div>
            <h1>Add Entry</h1>
            <p>Record a salary payment, loan, or repayment.</p>
          </div>
        </header>
        <form class="card" id="entry-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="entry-date">Date (DD/MM/YYYY)</label>
              <div class="date-picker-wrap">
                <input
                  class="input"
                  type="text"
                  id="entry-date"
                  inputmode="numeric"
                  placeholder="DD/MM/YYYY"
                  maxlength="10"
                  required
                />
                <input
                  type="date"
                  id="entry-date-picker"
                  tabindex="-1"
                  aria-hidden="true"
                  class="date-picker-hidden"
                />
                <button
                  type="button"
                  class="date-picker-btn"
                  id="open-calendar-btn"
                  title="Choose date from calendar"
                >
                  📅
                </button>
              </div>
              <span class="form-hint">Indian format: DD/MM/YYYY (e.g. 19/08/2026)</span>
            </div>
            <div class="form-group">
              <label class="form-label">Employee</label
              ><select class="select" id="entry-employee" required>
                <option value="">Loading employees…</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Entry Type</label>
              <div class="grid grid-3">
                <button
                  class="btn btn-secondary entry-type"
                  type="button"
                  data-type="salary_given"
                >
                  💵 Salary Given</button
                ><button
                  class="btn btn-secondary entry-type"
                  type="button"
                  data-type="loan_given"
                >
                  🏦 Loan Given</button
                ><button
                  class="btn btn-secondary entry-type"
                  type="button"
                  data-type="repayment"
                >
                  🔄 Repayment
                </button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Amount</label
              ><input
                class="input"
                id="entry-amount"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="₹ Amount"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Repayment Mode</label
              ><select class="select" id="repayment-mode" disabled>
                <option value="fifo">FIFO Auto</option>
                <option value="specific">Specific Loan</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Remarks</label
              ><textarea
                class="textarea"
                id="entry-remarks"
                placeholder="Optional notes"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" type="submit">Save Entry</button>
          </div>
        </form>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/add-entry.js"></script>
